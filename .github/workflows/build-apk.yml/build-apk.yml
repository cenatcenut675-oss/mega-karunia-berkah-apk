name: Build Mega Karunia Berkah APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        run: |
          echo "Mencari proyek Android"
          find . -name gradlew -type f
          find . -name settings.gradle -type f

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find . -name gradlew -type f | head -n 1)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "File gradlew tidak ditemukan"
            exit 1
          fi
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mega-Karunia-Berkah-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
