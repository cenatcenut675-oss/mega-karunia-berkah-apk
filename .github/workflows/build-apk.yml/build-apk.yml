name: Build Mega Karunia Berkah APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking Android project files"
          find . -maxdepth 3 -type f
          echo "Check complete"
